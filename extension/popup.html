<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvidenceCheck AI</title>
  <style>
    :root {
      --bg: #080D16;
      --surface: #111B2A;
      --surface-elevated: #192739;
      --text: #EAF2F7;
      --text-muted: #94A3B8;
      --cyan: #23C9C5;
      --cyan-glow: rgba(35, 201, 197, 0.25);
      --emerald: #10B981;
      --rose: #F43F5E;
      --border: rgba(35, 201, 197, 0.2);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      min-height: 500px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, rgba(35, 201, 197, 0.2), rgba(16, 185, 129, 0.1));
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
      color: #FFFFFF;
    }

    .brand-title span {
      color: var(--cyan);
    }

    .badge-pill {
      font-size: 9px;
      font-family: monospace;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(35, 201, 197, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(35, 201, 197, 0.3);
    }

    /* Card Containers */
    .card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--cyan);
    }

    .char-count {
      font-size: 10px;
      font-family: monospace;
      color: var(--text-muted);
    }

    /* Input Area */
    textarea {
      width: 100%;
      height: 90px;
      background: #04070D;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.4;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    /* Selection context chip */
    .selection-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .dot-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 6px var(--emerald);
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      border: none;
      outline: none;
    }

    .btn-primary {
      background: var(--cyan);
      color: #04070D;
      box-shadow: 0 2px 10px var(--cyan-glow);
      margin-bottom: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1cb5b1;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #1A2433;
      color: #4B5563;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--cyan);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #22354e;
    }

    /* Safety Notice Banner */
    .notice {
      background: rgba(17, 27, 42, 0.7);
      border: 1px solid rgba(35, 201, 197, 0.15);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .notice strong {
      color: var(--text);
    }

    /* Settings section */
    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 2px;
      margin-top: 4px;
    }

    .settings-toggle:hover {
      color: var(--cyan);
    }

    .settings-drawer {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: #04070D;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .settings-drawer.open {
      display: block;
    }

    .server-input {
      width: 100%;
      background: #111B2A;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 8px;
      color: #FFFFFF;
      font-family: monospace;
      font-size: 11px;
      margin-top: 4px;
      margin-bottom: 6px;
      outline: none;
    }

    .server-input:focus {
      border-color: var(--cyan);
    }

    .btn-small {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      background: var(--surface-elevated);
      color: var(--cyan);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .btn-small:hover {
      background: #22354e;
    }

    .error-banner {
      display: none;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #FDA4AF;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .error-banner.visible {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">EvidenceCheck<span>.ai</span></div>
      </div>
    </div>
    <span class="badge-pill">Constellation v1.0</span>
  </header>

  <!-- Error Banner -->
  <div id="error-banner" class="error-banner"></div>

  <!-- Claim Input Capsule -->
  <div class="card">
    <div class="label-row">
      <span class="field-label">Factual Assertion to Investigate</span>
      <span id="char-count" class="char-count">0 / 500</span>
    </div>
    <textarea
      id="claim-input"
      placeholder="Select text on any webpage or paste a factual statement..."
      maxlength="500"
    ></textarea>
    <div id="selection-status" class="selection-chip">
      <div class="dot-pulse"></div>
      <span id="selection-text-desc">Ready for input</span>
    </div>
  </div>

  <!-- Actions -->
  <button id="btn-audit" class="btn btn-primary" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.3-4.3"/>
    </svg>
    <span>Audit Claim in Web App ↗</span>
  </button>

  <button id="btn-benchmark" class="btn btn-secondary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8v13H3V8"/>
      <path d="M1 3h22v5H1z"/>
      <path d="M10 12h4"/>
    </svg>
    <span>Inspect Verified Run (Speed of Light)</span>
  </button>

  <!-- Security & Credit Safeguard Disclosure -->
  <div class="notice" style="margin-top: 12px;">
    <strong>🛡️ Credit & Privacy Safeguard:</strong> Claims are prefilled in your secure web dashboard. Investigation requires your explicit confirmation before consuming search credits.
  </div>

  <!-- Settings Collapse -->
  <div class="settings-toggle" id="settings-toggle">
    <span>⚙️ Backend Server Settings</span>
    <span id="toggle-arrow">▾</span>
  </div>

  <div class="settings-drawer" id="settings-drawer">
    <label style="font-size:10px; color:var(--text-muted); text-transform:uppercase;">EvidenceCheck Web App URL:</label>
    <input type="text" id="server-url-input" class="server-input" value="http://localhost:3000" />
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button id="btn-save-settings" class="btn-small">Save URL</button>
      <span id="settings-feedback" style="font-size:10px; color:var(--emerald);"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
